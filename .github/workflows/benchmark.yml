name: QR Code Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    name: bench / ${{ matrix.os }} / node-${{ matrix.node }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmark
        run: node --expose-gc benchmark.mjs | tee result-${{ matrix.os }}-node${{ matrix.node }}.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.os }}-node${{ matrix.node }}
          path: result-${{ matrix.os }}-node${{ matrix.node }}.txt
